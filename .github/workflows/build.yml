name: Build iPhone app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create the Xcode project
        run: xcodegen generate

      - name: Build the app (unsigned)
        run: |
          xcodebuild \
            -project Nelo.xcodeproj \
            -scheme Nelo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Nelo.app Payload/
          zip -r Nelo.ipa Payload

      - name: Save the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Nelo-ipa
          path: Nelo.ipa
